name: Build

on:
  workflow_dispatch:
  push:
    branches: [ "scarthgap" ]
  pull_request:
    branches: [ "scarthgap" ]

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v3
    
    - name: Install deps
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gawk wget git diffstat unzip texinfo \
          gcc build-essential chrpath socat cpio \
          python3 python3-pip python3-pexpect xz-utils \
          debianutils iputils-ping python3-git python3-jinja2 \
          libegl1-mesa libsdl1.2-dev pylint xterm python3-subunit \
          mesa-common-dev zstd liblz4-tool gcc-arm-none-eabi \
          php gcab
    
    - name: init
      run: ./init.sh

    - name: Build all
      run: make build
      
    - name: Archive build
      uses: actions/upload-artifact@v4
      with:
        name: package.tar.gz
        path: target/package.tar.gz